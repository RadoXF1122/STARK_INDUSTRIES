name: Zbuduj STARK_INDUSTRIES.apk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Konfiguracja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Budowanie awaryjne i Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          mkdir -p dist
          echo '<html><body>Stark Industries Engine</body></html>' > dist/index.html
          npx cap init STARK_INDUSTRIES com.stark.edith --web-dir=dist --confirm || true
          npx cap add android || true

      - name: Spawanie pliku APK
        run: |
          npx cap sync || true
          cd android && ./gradlew assembleDebug

      - name: Wypluj gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: STARK_INDUSTRIES
          path: android/app/build/outputs/apk/debug/app-debug.apk

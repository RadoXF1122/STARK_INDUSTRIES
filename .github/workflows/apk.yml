name: Zbuduj STARK_INDUSTRIES.apk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Konfiguracja Javy v17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalacja zbroi Capacitora
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli
          mkdir -p dist
          echo '<html><body>Stark Industries Engine</body></html>' > dist/index.html
          npx cap init STARK_INDUSTRIES com.stark.edith --web-dir=dist --confirm || true
          npx cap add android || true

      - name: Spawanie oficjalnego pliku APK
        run: |
          npx cap sync android || true
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Brak folderu android! Tworzenie wymuszone..."
            npx cap add android
            cd android && ./gradlew assembleDebug
          fi

      - name: Wypluj gotowy plik APK dla Szefa
        uses: actions/upload-artifact@v4
        with:
          name: STARK_INDUSTRIES
          path: android/app/build/outputs/apk/debug/app-debug.apk

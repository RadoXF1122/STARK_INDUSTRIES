name: Zbuduj STARK_INDUSTRIES.apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v5

      - name: Zainstaluj Node.js v24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Konfiguracja Javy v17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Budowanie bazy projektu
        run: |
          npm install --legacy-peer-deps || npm install
          mkdir -p dist
          echo '<html><body>Stark Industries Engine 2026</body></html>' > dist/index.html

      - name: Tworzenie struktury Android (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          CI=true npx cap init STARK_INDUSTRIES com.stark.edith --web-dir=dist
          npx cap add android

      - name: Spawanie oficjalnego pliku APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Debug: sprawdź, czy APK istnieje
        run: |
          ls -R android/app/build/outputs/apk || true

      - name: Wypluj gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: STARK_INDUSTRIES
          path: android/app/build/outputs/apk/debug/app-debug.apkname: Zbuduj STARK_INDUSTRIES.apk

